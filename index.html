<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital CLock</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <div class="time">
        <h1 id="hours">10</h1>
        <span>:</span>
      </div>

      <div class="time">
        <h1 id="minutes">01</h1>
        <span>:</span>
      </div>

      <div class="time">
        <h1 id="seconds">10</h1>
        <span>:</span>
      </div>

      <div class="time">
        <h1 id="ampm">PM</h1>
      </div>
      
    </div>
    <script src="script.js"></script>
  </body>
</html>
